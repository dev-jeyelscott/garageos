name: Manual Engineering Loop

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode. dry-run is default and safest.'
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - run
          - first-5-dry-run
          - first-5
      task_id:
        description: 'Optional task key or Notion page id. Example: ENG-LOOP-24.'
        required: false
        type: string
        default: ''
      max_tasks:
        description: 'Maximum tasks to process. Use 1 for one-task modes and 5 for first-5 modes.'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '5'
      dry_run:
        description: 'Keep the run non-mutating. Must stay true unless mode is run/first-5 and confirmation is provided.'
        required: true
        type: boolean
        default: true
      create_branch:
        description: 'Allow branch-producing behavior when the runner supports it. Requires mutation mode and confirmation.'
        required: true
        type: boolean
        default: false
      create_pr_body:
        description: 'Generate PR body/evidence when task metadata is available.'
        required: true
        type: boolean
        default: true
      mutate_notion:
        description: 'Allow Notion mutations. Requires mutation mode, confirmation, and Notion token secret.'
        required: true
        type: boolean
        default: false
      run_validation:
        description: 'Run the validation executor after runner execution.'
        required: true
        type: boolean
        default: true
      validation_command:
        description: 'Validation command passed to the validation executor.'
        required: true
        type: string
        default: 'pnpm validate:quick'
      mutation_confirmation:
        description: 'Required exact value: ENG-LOOP-23-RUN for run, ENG-LOOP-24-FIRST-5 for first-5.'
        required: false
        type: string
        default: ''
      merge_pr:
        description: 'Run guarded PR merge after deterministic merge gate passes. Requires mode=run and ENG-LOOP-33 confirmation.'
        required: true
        type: boolean
        default: false
      merge_confirmation:
        description: 'Required exact value when merge_pr is true: ENG-LOOP-33-MERGE.'
        required: false
        type: string
        default: ''
      merge_method:
        description: 'GitHub merge method for guarded manual merge.'
        required: true
        type: choice
        default: squash
        options:
          - squash
          - merge
          - rebase

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: engineering-loop-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Validate manual workflow inputs
        run: node ./.github/scripts/eng-loop-workflow-preflight.cjs
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_MAX_TASKS: ${{ inputs.max_tasks }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CREATE_BRANCH: ${{ inputs.create_branch }}
          INPUT_CREATE_PR_BODY: ${{ inputs.create_pr_body }}
          INPUT_MUTATE_NOTION: ${{ inputs.mutate_notion }}
          INPUT_RUN_VALIDATION: ${{ inputs.run_validation }}
          INPUT_VALIDATION_COMMAND: ${{ inputs.validation_command }}
          INPUT_MUTATION_CONFIRMATION: ${{ inputs.mutation_confirmation }}
          INPUT_MERGE_PR: ${{ inputs.merge_pr }}
          INPUT_MERGE_CONFIRMATION: ${{ inputs.merge_confirmation }}
          INPUT_MERGE_METHOD: ${{ inputs.merge_method }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}

      - name: Upload preflight plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-loop-preflight-${{ github.run_id }}
          path: |
            .tmp/eng-loop-workflow-command-plan.md
            .tmp/eng-loop-workflow-inputs.json
          if-no-files-found: warn
          retention-days: 14

  dry-run:
    name: Dry-run engineering loop
    needs: preflight
    if: ${{ inputs.mode == 'dry-run' || inputs.mode == 'first-5-dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_TASK_ID: ${{ inputs.task_id }}
      INPUT_MAX_TASKS: ${{ inputs.max_tasks }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_CREATE_BRANCH: ${{ inputs.create_branch }}
      INPUT_CREATE_PR_BODY: ${{ inputs.create_pr_body }}
      INPUT_MUTATE_NOTION: ${{ inputs.mutate_notion }}
      INPUT_RUN_VALIDATION: ${{ inputs.run_validation }}
      INPUT_VALIDATION_COMMAND: ${{ inputs.validation_command }}
      INPUT_MUTATION_CONFIRMATION: ${{ inputs.mutation_confirmation }}
      INPUT_MERGE_PR: ${{ inputs.merge_pr }}
      INPUT_MERGE_CONFIRMATION: ${{ inputs.merge_confirmation }}
      INPUT_MERGE_METHOD: ${{ inputs.merge_method }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate manual workflow inputs
        run: node ./.github/scripts/eng-loop-workflow-preflight.cjs

      - name: Run engineering loop runner in dry-run mode
        run: |
          mkdir -p .tmp
          node ./.github/scripts/eng-loop-runner.cjs --mode="${INPUT_MODE}"

      - name: Run local validation executor
        if: ${{ inputs.run_validation == true }}
        run: node ./.github/scripts/eng-loop-validation-executor.cjs -- --command "${INPUT_VALIDATION_COMMAND}"

      - name: Generate PR body evidence when task metadata exists
        if: ${{ inputs.create_pr_body == true }}
        run: |
          if [ -f .tmp/eng-loop-task.json ]; then
            node ./.github/scripts/eng-loop-pr-automation.cjs --task .tmp/eng-loop-task.json
          else
            echo "::notice::No .tmp/eng-loop-task.json found; skipping PR body evidence generation."
          fi

      - name: Run CI status watcher when available
        continue-on-error: true
        run: |
          if [ -f ./.github/scripts/eng-loop-ci-status-watcher.cjs ]; then
            node ./.github/scripts/eng-loop-ci-status-watcher.cjs
          else
            echo "::notice::CI status watcher script not found; skipping."
          fi

      - name: Upload engineering loop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-loop-manual-dry-run-${{ github.run_id }}
          path: |
            .tmp/eng-loop-*.json
            .tmp/eng-loop-*.md
            .tmp/eng-loop-*.txt
          if-no-files-found: warn
          retention-days: 14

  controlled-run:
    name: Controlled engineering loop run
    needs: preflight
    if: ${{ inputs.mode == 'run' || inputs.mode == 'first-5' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: write
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_TASK_ID: ${{ inputs.task_id }}
      INPUT_MAX_TASKS: ${{ inputs.max_tasks }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_CREATE_BRANCH: ${{ inputs.create_branch }}
      INPUT_CREATE_PR_BODY: ${{ inputs.create_pr_body }}
      INPUT_MUTATE_NOTION: ${{ inputs.mutate_notion }}
      INPUT_RUN_VALIDATION: ${{ inputs.run_validation }}
      INPUT_VALIDATION_COMMAND: ${{ inputs.validation_command }}
      INPUT_MUTATION_CONFIRMATION: ${{ inputs.mutation_confirmation }}
      INPUT_MERGE_PR: ${{ inputs.merge_pr }}
      INPUT_MERGE_CONFIRMATION: ${{ inputs.merge_confirmation }}
      INPUT_MERGE_METHOD: ${{ inputs.merge_method }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mutation-capable inputs
        run: node ./.github/scripts/eng-loop-workflow-preflight.cjs

      - name: Run engineering loop runner in controlled mode
        run: |
          mkdir -p .tmp
          if [ "${INPUT_MODE}" = "first-5" ]; then
            node ./.github/scripts/eng-loop-runner.cjs --mode=first-5 --confirm-first-5
          else
            node ./.github/scripts/eng-loop-runner.cjs --mode=run
          fi

      - name: Run local validation executor
        if: ${{ inputs.run_validation == true }}
        run: node ./.github/scripts/eng-loop-validation-executor.cjs -- --command "${INPUT_VALIDATION_COMMAND}"

      - name: Generate PR body evidence when task metadata exists
        if: ${{ inputs.create_pr_body == true }}
        run: |
          if [ -f .tmp/eng-loop-task.json ]; then
            node ./.github/scripts/eng-loop-pr-automation.cjs --task .tmp/eng-loop-task.json
          else
            echo "::notice::No .tmp/eng-loop-task.json found; skipping PR body evidence generation."
          fi

      - name: Run deterministic PR merge gate
        if: ${{ inputs.merge_pr == true }}
        run: node ./.github/scripts/pr-merge-gate.cjs

      - name: Execute guarded manual PR merge
        if: ${{ inputs.merge_pr == true }}
        run: node ./.github/scripts/pr-guarded-merge.cjs --mode=manual --confirm "${INPUT_MERGE_CONFIRMATION}" --merge-method "${INPUT_MERGE_METHOD}"

      - name: Complete merged PR task tracker update
        if: ${{ inputs.merge_pr == true && inputs.mutate_notion == true }}
        run: node ./.github/scripts/eng-loop-merged-pr-completion.cjs --mode=live --confirm "ENG-LOOP-35-COMPLETE" --task-id "${INPUT_TASK_ID}"

      - name: Create follow-up task on failure when explicitly enabled
        if: ${{ failure() && inputs.mutate_notion == true }}
        continue-on-error: true
        run: |
          if [ -f ./.github/scripts/eng-loop-follow-up-task.cjs ]; then
            node ./.github/scripts/eng-loop-follow-up-task.cjs
          else
            echo "::notice::Follow-up task creation script not found; skipping."
          fi

      - name: Upload engineering loop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-loop-manual-controlled-run-${{ github.run_id }}
          path: |
            .tmp/eng-loop-*.json
            .tmp/eng-loop-*.md
            .tmp/eng-loop-*.txt
            .tmp/pr-*.json
            .tmp/pr-*.md
            .tmp/pr-*.txt
          if-no-files-found: warn
          retention-days: 14
