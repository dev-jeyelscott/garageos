name: GarageOS Validation

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garageos-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only orchestrates deterministic GarageOS validation profiles.
# Tenant isolation, RBAC, branch access, and subscription lifecycle behavior
# must be proven by the underlying API/security/DB tests and deterministic
# test fixtures. Do not add fake tenant or permission environment variables here.
jobs:
  validation:
    name: validation-${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: quick
            command: pnpm validate:quick
            timeout: 10

          - profile: web
            command: pnpm validate:web
            timeout: 20

          - profile: api
            command: pnpm validate:api
            timeout: 20

          - profile: security
            command: pnpm validate:security
            timeout: 20

          - profile: e2e
            command: pnpm validate:e2e
            timeout: 30

    env:
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser dependencies
        if: matrix.profile == 'e2e'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run GarageOS validation profile
        run: ${{ matrix.command }}

  validation-database:
    name: validation-${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: garageos
          POSTGRES_PASSWORD: garageos
          POSTGRES_DB: garageos_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garageos -d garageos_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://garageos:garageos@localhost:5432/garageos_validation

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: db
            command: pnpm validate:db
            timeout: 20

          - profile: full
            command: pnpm validate:full
            timeout: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U garageos -d garageos_validation && exit 0
            sleep 2
          done

          echo "PostgreSQL did not become ready in time."
          exit 1

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Install Playwright browser dependencies
        if: matrix.profile == 'full'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run GarageOS validation profile
        run: ${{ matrix.command }}
