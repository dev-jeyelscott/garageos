# Semgrep provides a portable static-analysis gate without requiring GitHub Advanced Security.

name: Static Security Analysis

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/static-security-analysis.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/static-security-analysis.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    # Weekly static security drift check: Monday 01:30 UTC / 09:30 Asia/Manila.
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep security rules
        run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/secrets
          --config p/typescript
          --error
          --metrics=off
          --exclude node_modules
          --exclude .next
          --exclude dist
          --exclude coverage
          --exclude playwright-report
          --exclude test-results
          --exclude pnpm-lock.yaml
