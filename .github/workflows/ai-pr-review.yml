name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  MAX_DIFF_CHARS: '60000'
  OPENAI_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-4.1-mini' }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_API_URL: ${{ github.api_url }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  ai-pr-review:
    name: Advisory AI PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Skip when OpenAI key is not configured
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          echo "OPENAI_API_KEY is not configured; skipping advisory AI PR review."

      - name: Run advisory OpenAI review
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: node scripts/ai-pr-review.mjs
