name: GarageOS AI Review

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  MAX_DIFF_CHARS: '60000'
  OPENAI_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-4.1-mini' }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_API_URL: ${{ github.api_url }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  OPENAI_CONFIGURED: 'false'

jobs:
  advisory:
    name: advisory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate AI reviewer script syntax
        run: node --check ./.github/scripts/pr-ai-review.cjs

      - name: Detect OpenAI key configuration
        env:
          OPENAI_API_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "${OPENAI_API_KEY_CONFIGURED:-false}" = "true" ]; then
            echo "OPENAI_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "OPENAI_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Classify PR risk
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "${PR_BASE_REF:-}" ]; then
            echo "Missing pull request base ref."
            exit 1
          fi

          node ./.github/scripts/pr-risk-classifier.cjs --git --base "origin/$PR_BASE_REF"

      - name: Skip advisory AI review gate when OpenAI key is not configured
        if: ${{ env.OPENAI_CONFIGURED != 'true' }}
        run: |
          echo "OPENAI_API_KEY is not configured; skipping advisory AI review gate."

      - name: Run advisory AI review gate
        if: ${{ env.OPENAI_CONFIGURED == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_FAIL_MODE: open
        run: node ./.github/scripts/pr-ai-review.cjs

      - name: Upload AI review gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-ai-review-gate-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            .tmp/pr-risk-classifier-result.json
            .tmp/pr-risk-classifier-summary.md
            .tmp/pr-ai-review-result.json
            .tmp/pr-ai-review-summary.md
            .tmp/eng-loop-run-ledger.json
          if-no-files-found: warn
          retention-days: 14
