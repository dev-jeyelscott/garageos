name: AI PR Review

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  MAX_DIFF_CHARS: '60000'
  OPENAI_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-4.1-mini' }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_API_URL: ${{ github.api_url }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  ai-pr-review:
    name: Advisory AI PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate AI reviewer script syntax
        run: node --check scripts/ai-pr-review.mjs

      - name: Detect OpenAI key configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_CONFIGURED=false" >> "$GITHUB_ENV"
          else
            echo "OPENAI_CONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Skip when OpenAI key is not configured
        if: ${{ env.OPENAI_CONFIGURED != 'true' }}
        run: |
          echo "OPENAI_API_KEY is not configured; skipping advisory AI PR review."

      - name: Run advisory OpenAI review
        if: ${{ env.OPENAI_CONFIGURED == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ai-pr-review.mjs
